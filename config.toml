        Email = "juan@jdpinto.com"
        Googlescholar = "user=dzeXpP8AAAAJ"
        GitHub = "juandpinto"
        Linkedin = "jdpinto"
        # Twitter = "thejuanpinto"
        ORCID = "0000-0002-2972-485X"
        # Strava = "2609385"
