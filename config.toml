baseURL = "https://jdpinto.com"
# [en, zh-cn, fr, pl, ...] determines default content language
defaultContentLanguage = "en"
# theme
theme = "LoveIt"

# website title
title = "Juan D. Pinto"

# Email templates are source artifacts for family newsletters, not site content.
ignoreFiles = ["(?:^|/)email\\.html$"]

# whether to use robots.txt
# 是否使用 robots.txt
enableRobotsTXT = true
# whether to use git commit log
# 是否使用 git 信息
enableGitInfo = false
# whether to use emoji code
# 是否使用 emoji 代码
enableEmoji = true

[languages]
  [languages.en]
    weight = 1
    # language code
    locale = "en"
    # language name
    label = "🇺🇸 English"
    # whether to include Chinese/Japanese/Korean
    hasCJKLanguage = false
    # default amount of posts in each pages
    paginate = 12
    # Menu config
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "research"
        pre = ""
        post = ""
        name = "Research"
        url = "/research/"
        title = ""
        weight = 1
      [[languages.en.menu.main]]
        identifier = "about"
        pre = ""
        post = ""
        name = "About"
        url = "/about/"
        title = ""
        weight = 2
      [[languages.en.menu.main]]
        identifier = "resume"
        pre = ""
        post = ""
        name = "Resume"
        url = "https://jdpinto.com/pinto-resume.pdf"
        title = ""
        weight = 3
      [[languages.en.menu.main]]
        identifier = "contact"
        pre = ""
        post = ""
        name = "Contact"
        url = "/contact/"
        title = ""
        weight = 4
    #   [[languages.en.menu.main]]
    #     identifier = "family"
    #     pre = ""
    #     post = ""
    #     name = "Family"
    #     url = "/family/"
    #     title = ""
    #     weight = 5
    [languages.en.params]
      # site description
      description = "Juan D. Pinto is a data scientist specializing in AI evaluation, causal inference, and behavioral analytics."
      # site keywords
      keywords = ["Juan Pinto", "data scientist", "AI evaluation", "causal inference", "behavioral analytics", "educational data mining", "learning analytics", "machine learning"]
      # App icon config
      [languages.en.params.app]
        # optional site title override for the app when added to an iOS home screen or Android launcher
        title = "Juan D. Pinto"
        # whether to omit favicon resource links
        noFavicon = false
        # modern SVG favicon to use in place of older style .png and .ico files
